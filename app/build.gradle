plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.riley.cleanframe'
    compileSdk 34

    defaultConfig {
        applicationId 'dev.riley.cleanframe'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig false
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
